services:
 sql-server-enhanced:
    image: jrichardsz/sql-server-enhanced:ubuntu-22.04-sql.2022.rtm-cu15-1.0.3
    build:
      context: .
    container_name: sql-server-enhanced
    shm_size: 1g
    ports:
     - "1433:1433"
    environment:
      ACCEPT_EULA: 1
      MSSQL_PID: Developer
      MSSQL_USER: sa
      MSSQL_SA_PASSWORD: 70quasWNl*o#nu4U
      TZ: America/Lima
      SKIP_ERRORS: true
    volumes:
      - ./sample-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: cat /var/log/docker/sqlserver_db_init.log | grep [db_init_completed]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s 